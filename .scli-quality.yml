# SCLI Code Quality Configuration - Modern Python 2025 Best Practices
# This file configures code quality and formatting tools for the SCLI project
# Based on PEP 8, Black compatibility, and modern tooling standards
#
# USAGE:
# ======
# This configuration file is used by two main scripts:
#
# 1. scripts/code_quality_checker.py - Check code quality and style issues
#    Usage: uv run python scripts/code_quality_checker.py --mode all
#
# 2. scripts/code_formatter.py - Automatically format code
#    Usage: uv run python scripts/code_formatter.py --mode all
#
# Both scripts read their settings from this file, ensuring consistent
# code quality standards across the project.

# PyCodeStyle configuration - Complete options reference
pycodestyle:
  # ==========================================
  # ERROR SELECTION (mutually exclusive)
  # ==========================================
  
  # Rules to ignore (E/W codes) - Modern 2025 best practices
  ignore:
    # BLACK COMPATIBILITY (Essential for modern Python development)
    - E203  # Whitespace before ':' (conflicts with Black formatter)
    - W503  # Line break before binary operator (Black style, PEP 8 compliant since 2016)
    - W504  # Line break after binary operator (mutually exclusive with W503)
    
    # PRACTICAL MODERN EXCEPTIONS
    - E501  # Line too long (handled by max-line-length setting)
    - E701  # Multiple statements on one line (sometimes needed for simple cases)
    - E731  # Do not assign lambda to variable (sometimes useful in functional code)
    
    # DEPRECATED/CONTROVERSIAL RULES (commonly ignored in modern projects)
    - E121  # Continuation line under-indented for hanging indent
    - E123  # Closing bracket does not match indentation of opening bracket's line
    - E126  # Continuation line over-indented for hanging indent
    - E133  # Closing bracket is missing indentation (conflicts with E123)
    - E226  # Missing whitespace around arithmetic operator
    - E241  # Multiple spaces after ','
    - E242  # Tab after ','
    - E704  # Multiple statements on one line (def)
    - W505  # Doc line too long (handled by max-doc-length)
  
  # Alternative: Select specific rules to check (mutually exclusive with ignore)
  # Uncomment to use selection instead of ignore approach
  # select:
  #   - E4    # Import errors
  #   - E7    # Statement errors  
  #   - E9    # Runtime errors
  #   - F     # Pyflakes errors
  #   - W1    # Indentation warnings
  #   - W2    # Whitespace warnings
  #   - W3    # Blank line warnings
  
  # ==========================================
  # LINE LENGTH CONFIGURATION
  # ==========================================
  
  # Maximum line length - Black standard (modern Python best practice)
  max_line_length: 88
  
  # Maximum documentation line length (can be longer than code)
  max_doc_length: 100
  
  # ==========================================
  # INDENTATION CONFIGURATION  
  # ==========================================
  
  # Number of spaces per indentation level (PEP 8 standard)
  indent_size: 4
  
  # Hang closing brackets (compatible with Black)
  hang_closing: false
  
  # ==========================================
  # OUTPUT CONFIGURATION
  # ==========================================
  
  # Show source code for each error
  show_source: false
  
  # Show PEP 8 text explanation for each error
  show_pep8: false
  
  # Show statistics summary at the end
  statistics: true
  
  # Show total error count
  count: true
  
  # ==========================================
  # AUTOPEP8 COMPATIBILITY (if used together)
  # ==========================================
  
  # Aggressiveness level for autopep8 (0=safe, 1=more aggressive, 2=very aggressive)
  aggressive: 0
  
  # Enable experimental autopep8 features
  experimental: false

# ==========================================
# FILE EXCLUSION CONFIGURATION
# ==========================================

exclusions:
  # Patterns to exclude (supports glob patterns) - Comprehensive modern list
  patterns:
    # PYTHON CACHE AND COMPILED FILES
    - "__pycache__"     # Python bytecode cache
    - "*.pyc"           # Compiled Python files
    - "*.pyo"           # Optimized Python files  
    - "*.pyd"           # Python extension modules (Windows)
    - "*.so"            # Shared objects (Linux/Unix)
    
    # VERSION CONTROL SYSTEMS
    - ".git"            # Git repository
    - ".hg"             # Mercurial repository  
    - ".svn"            # Subversion repository
    - ".bzr"            # Bazaar repository
    
    # VIRTUAL ENVIRONMENTS
    - ".venv"           # Standard virtual environment
    - "venv"            # Alternative virtual environment
    - ".env"            # Environment variables file
    - "env"             # Alternative environment folder
    - ".virtualenv"     # Legacy virtual environment
    
    # PACKAGE MANAGERS
    - "node_modules"    # Node.js packages
    - ".npm"            # NPM cache
    - ".yarn"           # Yarn cache
    
    # PYTHON PACKAGING
    - "*.egg-info"      # Python egg metadata
    - "*.egg"           # Python eggs
    - "dist"            # Distribution files
    - "build"           # Build artifacts
    - ".eggs"           # Egg cache
    
    # TESTING AND COVERAGE
    - ".pytest_cache"   # Pytest cache
    - ".coverage"       # Coverage data
    - "htmlcov"         # Coverage HTML reports
    - ".tox"            # Tox testing
    - ".nox"            # Nox testing
    
    # IDE AND EDITOR FILES
    - ".vscode"         # VS Code settings
    - ".idea"           # PyCharm/IntelliJ
    - "*.swp"           # Vim swap files
    - "*.swo"           # Vim swap files
    - "*~"              # Backup files
    
    # OPERATING SYSTEM FILES
    - ".DS_Store"       # macOS metadata
    - "Thumbs.db"       # Windows thumbnails
    
    # DOCUMENTATION BUILD
    - "docs/_build"     # Sphinx documentation
    - "doc/_build"      # Alternative docs folder
    - "_build"          # Generic build folder
    
    # COMMON GENERATED/CACHE DIRECTORIES
    - "migrations"      # Django database migrations
    - "locale"          # Internationalization files
    - "static/CACHE"    # Django static file cache
    - "*.min.js"        # Minified JavaScript
    - "*.min.css"       # Minified CSS
  
  # Additional directories to exclude by name
  directories:
    - "vendor"          # Third-party libraries
    - "third_party"     # External dependencies
    - "external"        # External code
    - "lib"             # Library files
    - "libs"            # Alternative library folder
    - "node_modules"    # Node.js dependencies
    - "bower_components" # Bower components
    - "jspm_packages"   # JSPM packages
  
  # Specific files to exclude by name
  files:
    - "settings_local.py"   # Local Django settings
    - "local_settings.py"   # Alternative local settings
    - "config_local.py"     # Local configuration
    - "manage.py"           # Django management script
    - "setup.py"            # Package setup script
    - "conftest.py"         # Pytest configuration

# ==========================================
# ERROR LIMITS AND THRESHOLDS
# ==========================================

limits:
  # Maximum total errors allowed before script fails (0 = strict quality enforcement)
  max_total_errors: 0
  
  # Default maximum errors per individual file
  max_errors_per_file: 10
  
  # File-specific limits based on patterns (allows for context-appropriate standards)
  file_specific:
    # TEST FILES (more lenient - tests often have different patterns)
    "test_*.py": 25         # Standard test file prefix
    "*_test.py": 25         # Alternative test file suffix  
    "tests/*.py": 25        # Test directory files
    "test*.py": 25          # Any file starting with 'test'
    
    # DJANGO PROJECT FILES
    "migrations/*.py": 100  # Auto-generated migration files (very lenient)
    "manage.py": 50         # Django management command
    
    # CONFIGURATION FILES (often have long lines and complex structures)
    "settings*.py": 30      # Django settings files
    "config*.py": 30        # Configuration files
    "setup.py": 50          # Package setup (often has metadata)
    "conftest.py": 30       # Pytest configuration
    
    # SCRIPT AND UTILITY FILES
    "scripts/*.py": 20      # Script files (slightly more lenient)
    "utils/*.py": 15        # Utility functions (should be clean)
    "tools/*.py": 20        # Tool scripts

# ==========================================
# DEFAULT BEHAVIOR CONFIGURATION
# ==========================================

# Default evaluation mode when no CLI argument is provided
default_mode: "all"  # Options: all, staged, unstaged, modified, tracked

# ==========================================
# OUTPUT AND DISPLAY CONFIGURATION
# ==========================================

output:
  # Show verbose output by default (detailed file-by-file progress)
  verbose: false
  
  # Show summary report at the end
  show_summary: true
  
  # Show improvement suggestions
  show_suggestions: true
  
  # Use colors in output (if terminal supports it)
  use_colors: true
  
  # Show progress while checking files
  show_progress: true
  
  # Show error codes in output (helpful for understanding issues)
  show_error_codes: true
  
  # Show statistics summary
  show_statistics: true

# ==========================================
# GIT INTEGRATION CONFIGURATION
# ==========================================

git:
  # Automatically detect git repository root
  auto_detect: true
  
  # Respect .gitignore file patterns for exclusions
  respect_gitignore: true
  
  # Include untracked files when using 'all' mode
  include_untracked: true

# ==========================================
# FORMAT ACTIONS CONFIGURATION (for code_formatter.py)
# ==========================================
# This section controls specific formatting actions to apply
# Enable/disable individual formatting features as needed

format:
  # IMPORT MANAGEMENT
  sort_imports: true              # Sort imports alphabetically
  group_imports: true             # Group imports by type (stdlib, third-party, local)
  remove_unused_imports: true     # Remove imports that are not used
  move_imports_to_top: true       # Move imports to top of file (fixes E402)
  single_line_imports: false      # Force one import per line
  
  # CODE FORMATTING
  fix_indentation: true           # Fix indentation to 4 spaces
  normalize_strings: true         # Convert strings to consistent quotes (")
  fix_line_length: true           # Break long lines (max 88 chars)
  remove_trailing_spaces: true    # Remove trailing whitespace
  add_trailing_comma: true        # Add trailing commas in multiline
  
  # WHITESPACE & SPACING
  fix_whitespace: true            # Fix whitespace around operators
  remove_blank_lines: true        # Remove excessive blank lines
  ensure_newline_eof: true        # Ensure newline at end of file
  spaces_around_operators: true   # Ensure proper spacing around operators
  
  # STATEMENT FORMATTING
  break_long_lines: true          # Break long statements properly
  fix_continuation_lines: true    # Fix line continuation indentation
  format_docstrings: true         # Format docstrings to PEP 257
  
  # SPECIFIC FIXES
  remove_print_statements: false  # Remove print() statements (use with caution)
  convert_tabs_to_spaces: true    # Replace tabs with spaces
  fix_encoding_declaration: true  # Add/fix encoding declaration if needed
  
  # Advanced options
  max_line_length: 88             # Maximum line length (Black standard)
  indent_size: 4                  # Number of spaces for indentation

# ==========================================
# EXTERNAL TOOLS INTEGRATION (2025 Modern Recommendations)
# ==========================================

tools:
  # MODERN RECOMMENDATIONS (2025)
  suggest_ruff: true          # Ultra-fast Rust-based linter + formatter (10-100x faster)
  suggest_mypy: true          # Static type checking (essential for modern Python)
  
  # TRADITIONAL TOOLS (still widely used)
  suggest_black: true         # Code formatter (PEP 8 compliant)
  suggest_isort: true         # Import sorting
  
  # LESS COMMON (disabled by default in modern workflows)
  suggest_flake8: false       # Traditional linter (consider Ruff instead)
  suggest_pylint: false       # Comprehensive but slow linter
  
  # AUTOMATION
  auto_format: false          # Experimental: auto-run formatters if available

# ==========================================
# MODERN COMPATIBILITY SETTINGS (2025)
# ==========================================

compatibility:
  # Ensure configuration works seamlessly with Black formatter
  black_compatible: true
  
  # Ensure configuration works with modern Ruff linter
  ruff_compatible: true
  
  # Maintain strict PEP 8 compliance where possible
  pep8_compliant: true

# ==========================================
# ADVANCED CONFIGURATION (Optional)
# ==========================================

# Report generation (optional - for CI/CD integration)
reports:
  # Generate JSON report for programmatic processing
  json_output: false
  json_file: "code_quality_report.json"
  
  # Generate HTML report for web viewing  
  html_output: false
  html_file: "code_quality_report.html"

# Performance optimization
performance:
  # Number of files to process in parallel (adjust based on CPU cores)
  max_workers: 4
  
  # Enable result caching for faster subsequent runs
  enable_cache: false
  cache_dir: ".scli_cache"
  cache_ttl: 3600  # Cache expiration in seconds

# ==========================================
# MIGRATION NOTES FOR 2025
# ==========================================

# RECOMMENDED MIGRATION PATH:
# 1. Current setup: Use this pycodestyle configuration for immediate PEP 8 compliance
# 2. Modern upgrade: Consider migrating to Ruff for 10-100x faster performance:
#    - Install: pip install ruff
#    - Replace: ruff check . (instead of pycodestyle)
#    - Format: ruff format . (instead of black)
# 3. Full modern stack: ruff + mypy for comprehensive code quality

# COMPATIBILITY NOTES:
# - This configuration is fully compatible with Black, isort, and modern formatters
# - All ignore rules are based on 2025 best practices and tool compatibility
# - File exclusions cover modern development environments and frameworks
# - Error limits are context-aware for different types of Python files

# For more information:
# - PEP 8: https://peps.python.org/pep-0008/
# - Ruff: https://github.com/astral-sh/ruff
# - Black: https://black.readthedocs.io/
# - Modern Python practices: https://docs.python-guide.org/