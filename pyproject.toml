[project]
name = "scli"
version = "0.1.0"
description = "A Python CLI project"
authors = [
    { name = "bypabloc", email = "bypabloc@example.com" },
]
dependencies = [
    "loguru>=0.7.3",
    "rich>=14.1.0",
    "survey>=5.4.2",
    "typer>=0.17.3",
]
requires-python = ">=3.12"
readme = "README.md"
license = { text = "MIT" }

[project.scripts]
scli = "src.main:main"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src"]

[tool.uv]
dev-dependencies = [
    "coverage>=7.10.6",
    "pytest>=8.4.1",
    "pytest-console-scripts>=1.4.1",
    "pytest-cov>=6.2.1",
    "pytest-mock>=3.14.1",
]
